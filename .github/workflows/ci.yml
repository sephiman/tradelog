name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A migration already applied somewhere is frozen: Flyway checksums the raw file, so even a
  # comment edit crash-loops every environment that ran it. Cheap job, runs before anything else.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Applied migrations must not change
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # First push of a branch (or an initial commit) reports an all-zero base — nothing to diff against.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base revision to compare against; skipping."
            exit 0
          fi
          sh scripts/check-migrations-immutable.sh "$BASE"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matches the toolchain in backend/build.gradle.kts.
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # build = compile + test (Testcontainers Postgres runs on the runner's Docker) + bootJar
      - run: ./gradlew --no-daemon build

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tradelog-backend:ci ./backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the node major used by the production image (frontend/Dockerfile).
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc -b + vite build, same pair the .husky/pre-push hook runs locally.
      - run: npm run build
      - run: npm test

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile copies an explicit file list, so a new root-level source file silently
      # breaks the image while the frontend job above stays green.
      - run: docker build -t tradelog-frontend:ci ./frontend
