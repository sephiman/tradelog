spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  registration:
    mode: open
  security:
    # Every HTTP test registers or logs in from localhost, so they all share one per-IP bucket and
    # the production 20/hour ceiling is a suite-wide budget. Hitting it makes an unrelated test fail
    # with 429 depending on execution order — raise it here rather than rationing registrations.
    login-rate:
      per-minute: 100000
      per-hour: 100000
  crypto:
    # Deterministic 32-byte AES key (base64 of "01234567890123456789012345678901") for tests.
    key: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
  bootstrap:
    admin-email: ""
    admin-password: ""
  # SMTP fully configured so the mail-backed paths are reachable; RecordingEmailSender stands in for
  # the real SmtpEmailSender, and TogglableMailAvailability flips the switch for the disabled cases.
  public-url: "https://tradelog.test"
  mail:
    host: "smtp.test"
    port: 2525
    username: "mailer"
    password: "not-a-real-password"
    from: "tradelog <noreply@tradelog.test>"
  benchmark:
    # No test may reach a price provider: tests seed benchmark_prices directly instead.
    backfill-on-start: false
    schedule:
      enabled: false
