# Generic
INTERNAL_ERROR=Error inesperado
VALIDATION_FAILED=La validación ha fallado
DATA_INTEGRITY_VIOLATION=Conflicto con datos existentes
INVALID_PARAMETER=Parámetro inválido: {0}
NOT_FOUND=No encontrado
FORBIDDEN=Acceso denegado
UNAUTHORIZED=Autenticación requerida
RATE_LIMITED=Demasiadas solicitudes, inténtalo de nuevo más tarde

# Validation
validation.required=Este campo es obligatorio
validation.invalid=Valor inválido
validation.too.long=El valor es demasiado largo
validation.email.invalid=Introduce un correo electrónico válido
validation.password.length=La contraseña debe tener al menos 8 caracteres

# Auth
INVALID_CREDENTIALS=Credenciales inválidas
EMAIL_ALREADY_REGISTERED=Ese correo ya está registrado
REGISTRATION_DISABLED=El registro está deshabilitado
PASSWORD_MISMATCH=La contraseña actual es incorrecta
EMAIL_UNCHANGED=Ese ya es el correo de esta cuenta

# Password reset (self-service, mailed link). One code for unknown/expired/used: the reason is not disclosed.
PASSWORD_RESET_TOKEN_INVALID=Este enlace de restablecimiento no es válido o ha caducado
password_reset.mail.subject=Restablece tu contraseña de tradelog
password_reset.mail.body=Hola,\n\nAlguien ha pedido restablecer la contraseña de la cuenta de tradelog asociada a esta dirección. Si has sido tú, abre el siguiente enlace en los próximos {1} minutos:\n\n{0}\n\nSi no has pedido ningún restablecimiento, ignora este mensaje: tu contraseña no cambia.\n\ntradelog

# Email change. The confirmation goes to the new address, the notice to the one losing the account.
EMAIL_CHANGE_TOKEN_INVALID=Este enlace de confirmación no es válido o ha caducado
email_change.mail.subject=Confirma tu nuevo correo de tradelog
email_change.mail.body=Hola,\n\nSe ha pedido cambiar la dirección de correo de tu cuenta de tradelog. Para confirmar esta dirección, abre el siguiente enlace en los próximos {1} minutos:\n\n{0}\n\nSi no has pedido este cambio, ignora este mensaje: tu cuenta conserva su dirección actual.\n\ntradelog
email_change.notice.subject=Se ha pedido cambiar el correo de tu cuenta de tradelog
email_change.notice.body=Hola,\n\nAlguien ha pedido mover tu cuenta de tradelog a otra dirección de correo. El cambio solo se aplica cuando se confirma la dirección nueva.\n\nSi no has sido tú, entra ahora y cambia tu contraseña: eso cancela cualquier cambio pendiente.\n\ntradelog

# Profiles
PROFILE_NOT_FOUND=Perfil no encontrado
PROFILE_NAME_TAKEN=Ya tienes un perfil con ese nombre
NOT_PROFILE_OWNER=No tienes acceso a este perfil
# Positions & taxonomy
POSITION_NOT_FOUND=Posición no encontrada
POSITION_NOT_MANUAL=Solo se pueden editar las operaciones añadidas a mano — las sincronizadas se reescriben en la próxima sincronización
POSITION_KIND_MISMATCH=Esa entrada es de otro tipo — una operación y una ejecución de bot de grillas se editan en su propio formulario
TAG_NOT_FOUND=Etiqueta no encontrada
TAG_GROUP_NOT_FOUND=Grupo de etiquetas no encontrado
TAG_GROUP_MISMATCH=Esa etiqueta no pertenece al grupo indicado
TAG_ARCHIVED=Esa etiqueta está archivada y ya no se puede asignar

# Data sources & connectors
DATA_SOURCE_NOT_FOUND=Fuente de datos no encontrada
DATA_SOURCE_CREDENTIALS_REQUIRED=Se requieren la clave y el secreto de API para esta fuente
DATA_SOURCE_NO_CREDENTIALS=Esta fuente de datos no tiene credenciales almacenadas
DATA_SOURCE_NOT_SYNCABLE=Esta fuente se actualiza subiendo un archivo, no mediante sincronización
DATA_SOURCE_CREDENTIALS_INVALID=El exchange rechazó las credenciales de API
DATA_SOURCE_PERMISSION_DENIED=La clave de API no tiene el permiso de lectura requerido (o tiene permisos de escritura/retirada)
DATA_SOURCE_PASSPHRASE_REQUIRED=Este exchange requiere además la passphrase de API que elegiste al crear la clave
DATA_SOURCE_EXCHANGE_CLOSED=Este exchange ha cerrado, así que ya no hay nada que sincronizar. Tu historial importado se conserva íntegro.
DATA_SOURCE_NOT_FILE=Esta fuente se actualiza mediante sincronización, no añadiendo o subiendo operaciones
CONNECTOR_NOT_AVAILABLE=No hay conector disponible para {0}
CONNECTOR_NOT_API=El conector {0} no es una fuente de API
CONNECTOR_NOT_FILE=El conector {0} no es una fuente de importación de archivo

# Sync & import
SYNC_RATE_LIMITED=La sincronización está limitada para este exchange, inténtalo en breve
SYNC_ALREADY_RUNNING=Ya hay una sincronización o importación en curso para esta fuente, inténtalo en breve
SYNC_FAILED=La sincronización ha fallado
IMPORT_FAILED=La importación ha fallado
IMPORT_PARSE_FAILED=No se pudo procesar el archivo
IMPORT_NO_POSITIONS=No se encontraron posiciones cerradas en el archivo
IMPORT_ROW_INVALID=No se pudo importar la fila {0}: {1}
IMPORT_MISSING_COLUMN=Falta la columna obligatoria ''{0}'' o está vacía
IMPORT_BAD_SIDE=Lado ''{0}'' no válido (usa long o short)
IMPORT_BAD_DATE=Fecha ''{0}'' no válida (usa AAAA-MM-DD)
MANUAL_CLOSED_BEFORE_OPENED=La fecha de cierre no puede ser anterior a la de apertura

# Credentials / crypto
CRYPTO_KEY_MISSING=La clave de cifrado no está configurada en el servidor
CRYPTO_KEY_INVALID=La clave de cifrado del servidor no es válida
CREDENTIALS_CORRUPT=Las credenciales almacenadas están corruptas y no se pueden leer

# Backup & restore
BACKUP_CONFIRM_REQUIRED=Restaurar reemplaza todos tus datos y debe confirmarse explícitamente
BACKUP_VERSION_UNSUPPORTED=Esta copia se hizo con una versión más nueva (v{0}) y no se puede restaurar aquí
BACKUP_TOO_LARGE=El archivo de copia es demasiado grande para restaurar (más de {0} filas)
BACKUP_NO_CREDENTIALS=Restaurado desde copia — añade tus claves API para reanudar la sincronización
